# Optional template: copy to .github/workflows/bertopic-workflow.yml to enable.
name: BERTopic workflow
on:
  push:
    paths: ['workflow/**', '.github/workflows/bertopic-workflow.yml']
  pull_request:
    paths: ['workflow/**', '.github/workflows/bertopic-workflow.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      USE_TORCH: '0'
      USE_TF: '0'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install CPU runtime and workflow
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e './workflow[test]'
      - name: Install test font from a pinned author commit
        shell: python
        run: |
          import os
          from pathlib import Path
          from urllib.request import urlretrieve
          target = Path(os.environ['RUNNER_TEMP']) / 'workflow-test-font.ttc'
          urlretrieve('https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTC/NotoSansCJK-Regular.ttc', target)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('WORKFLOW_TEST_FONT=' + str(target) + '\n')
      - name: Test
        working-directory: workflow
        run: |
          python -m ruff check src tests tools
          python -m pytest --junitxml=.validation/test-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: workflow/.validation/test-results.xml
