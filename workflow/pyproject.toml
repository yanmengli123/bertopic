[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-bertopic-workflow"
version = "0.1.0"
description = "Auditable bibliographic BERTopic workflow with desktop IPC"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  # jieba 0.42.1 imports pkg_resources at runtime; retain a compatible provider.
  "setuptools==80.9.0",
  "pydantic==2.12.5", "numpy==2.4.1", "pandas==2.3.3",
  "scikit-learn==1.8.0", "scipy==1.17.0", "bertopic==0.17.4",
  "numba==0.68.0", "llvmlite==0.50.0", "pynndescent==0.6.0",
  "umap-learn==0.5.12", "hdbscan==0.8.44", "jieba==0.42.1",
  "requests==2.32.5", "tokenizers==0.22.1", "huggingface-hub==1.6.0",
  "safetensors==0.7.0", "lxml==6.0.2", "openpyxl==3.1.5", "xlrd==2.0.2",
  "matplotlib==3.10.8", "plotly==6.5.2", "wordcloud==1.9.6",
  "Pillow==12.0.0", "defusedxml==0.7.1", "psutil>=7,<8", "pycountry==26.2.16",
  "packaging>=24,<27",
]

[project.optional-dependencies]
# Local inference stack: only required when embedding.backend == "local".
local = ["sentence-transformers>=5.2,<7", "transformers>=5,<6", "torch>=2.6,<3"]
test = ["pytest>=7.4,<9", "build>=1.3,<2", "ruff>=0.16,<1", "jsonschema>=4.25,<5"]

[project.scripts]
bertopic-workflow = "bertopic_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bertopic_workflow = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E9", "F", "B", "S307"]
